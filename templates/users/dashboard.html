{% extends "base.html" %}

{% block content %}
<div class="container">
    <h2>Dashboard</h2>

    <div class="dashboard-grid">
        <div class="dashboard-card">
            <h3>Welcome</h3>
            <p>{{ user_name }}</p>
            <p>Role: {{ role }}</p>
        </div>

        <div class="dashboard-card">
            <h3>User Management</h3>
            <p>Manage all users from here</p>
            <a href="{{ url_for('users.user_list') }}">View Users →</a>
        </div>

        <div class="dashboard-card">
            <h3>Add User</h3>
            <p>Create a new user account</p>
            <a href="{{ url_for('users.add_user') }}">Add User →</a>
        </div>
    </div>
</div>
{% endblock %}
